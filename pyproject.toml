[project]
name = "nrf5-eink"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22", "pillow>=10"]

[project.scripts]
eink = "epd.cli:main"   # uv run eink web | uv run eink --push | uv run eink list ...

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epd", "screens"]
